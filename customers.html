<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supiri.Lk — Customers</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container-fluid"><div class="row">
<aside class="col-md-3 col-lg-2 admin-sidebar p-3"><a href="index.html" class="brand text-white">SUPIRI.LK<small>ADMIN PANEL</small></a><nav class="nav flex-column mt-4 gap-2"><a class="nav-link" href="admin.html">Dashboard</a><a class="nav-link" href="products.html">Products</a><a class="nav-link" href="inventory.html">Inventory</a><a class="nav-link" href="orders.html">Orders</a><a class="nav-link active" href="customers.html">Customers</a><a class="nav-link" href="settings.html">Settings</a><button type="button" class="nav-link btn btn-link text-start mt-3" onclick="adminLogout()">↪ Logout</button></nav></aside>
<main class="col-md-9 col-lg-10 p-4 p-lg-5"><div class="admin-topbar d-flex justify-content-end align-items-center gap-2">
<a href="index.html" class="btn btn-outline-custom">Store</a>
</div><h1 class="fw-bold">Customers</h1><p class="text-secondary">Customer data from Node.js backend.</p><div class="table-card"><div class="p-3 border-bottom"><input id="search" class="form-control" placeholder="Search customer..."></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total Spent</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div></div><script src="js/api.js"></script><script>
let all=[];async function load(){try{all=await apiFetch('/customers');render()}catch(e){showError(e)}}function render(){const q=search.value.toLowerCase();rows.innerHTML=all.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.phone}</td><td>${x.orders}</td><td>Rs. ${Number(x.totalSpent).toLocaleString()}</td></tr>`).join('')}search.addEventListener('input',render);load();
</script><script src="js/admin-auth.js"></script><script>requireAdmin();</script></body></html>
