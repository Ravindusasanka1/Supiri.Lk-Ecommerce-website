<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supiri.Lk — Inventory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container-fluid"><div class="row">
<aside class="col-md-3 col-lg-2 admin-sidebar p-3"><a href="index.html" class="brand text-white">SUPIRI.LK<small>ADMIN PANEL</small></a><nav class="nav flex-column mt-4 gap-2"><a class="nav-link" href="admin.html">Dashboard</a><a class="nav-link" href="products.html">Products</a><a class="nav-link active" href="inventory.html">Inventory</a><a class="nav-link" href="orders.html">Orders</a><a class="nav-link" href="customers.html">Customers</a><a class="nav-link" href="settings.html">Settings</a><button type="button" class="nav-link btn btn-link text-start mt-3" onclick="adminLogout()">↪ Logout</button></nav></aside>
<main class="col-md-9 col-lg-10 p-4 p-lg-5"><div class="admin-topbar d-flex justify-content-end align-items-center gap-2">
<a href="index.html" class="btn btn-outline-custom">Store</a>
</div><h1 class="fw-bold">Inventory</h1><p class="text-secondary">Live stock & customer restock alert subscriptions.</p><div class="row g-3 mb-4" id="stats"></div><div class="table-card mb-5"><div class="p-3 border-bottom"><h5 class="mb-0 fw-semibold">Product Stock Levels</h5></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Stock</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="table-card"><div class="p-3 border-bottom d-flex justify-content-between align-items-center"><h5 class="mb-0 fw-semibold"><i class="bi bi-bell text-gold me-2"></i> Restock Alert Subscriptions</h5><button class="btn btn-sm btn-outline-danger" onclick="clearRestockAlerts()">Clear All</button></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Product</th><th>Size</th><th>Colour</th><th>Channel</th><th>Contact</th><th>Requested Date</th><th>Status</th></tr></thead><tbody id="restockRows"></tbody></table></div></div></main></div></div>
<script src="js/api.js"></script><script>
async function load(){try{const [p,s]=await Promise.all([apiFetch('/products'),apiFetch('/settings')]);const alerts=JSON.parse(localStorage.getItem('supiriRestockAlerts')||'[]');document.getElementById('stats').innerHTML=`<div class="col-md-3"><div class="stat-card"><div class="display-6 fw-bold">${p.length}</div><div class="text-secondary">Products</div></div></div><div class="col-md-3"><div class="stat-card"><div class="display-6 fw-bold">${p.reduce((a,x)=>a+Number(x.stock),0)}</div><div class="text-secondary">Units in Stock</div></div></div><div class="col-md-3"><div class="stat-card"><div class="display-6 fw-bold text-danger">${p.filter(x=>x.stock<=s.threshold).length}</div><div class="text-secondary">Low Stock</div></div></div><div class="col-md-3"><div class="stat-card"><div class="display-6 fw-bold text-gold">${alerts.length}</div><div class="text-secondary">Restock Alerts</div></div></div>`;document.getElementById('rows').innerHTML=p.map(x=>`<tr><td>${x.name}</td><td>${x.sku}</td><td>${x.category}</td><td><input id="q${x.id}" type="number" min="0" value="${x.stock}" class="form-control" style="max-width:120px"></td><td>${x.stock<=s.threshold?'<span class="badge text-bg-warning">Low Stock</span>':'<span class="badge text-bg-success">In Stock</span>'}</td><td><button class="btn btn-sm btn-dark-custom" onclick="updateStock(${x.id})">Save</button></td></tr>`).join('');
const restockEl=document.getElementById('restockRows');
if(alerts.length===0){restockEl.innerHTML='<tr><td colspan="7" class="text-center py-4 text-muted">No active restock alert subscriptions yet.</td></tr>';}else{restockEl.innerHTML=alerts.map(a=>`<tr><td><strong>${a.productName}</strong></td><td><span class="badge bg-dark">${a.size}</span></td><td>${a.color}</td><td><span class="badge bg-secondary">${a.channel}</span></td><td class="font-monospace">${a.contact}</td><td><small class="text-muted">${a.date}</small></td><td><span class="badge text-bg-info">Pending Notify</span></td></tr>`).join('');}
}catch(e){showError(e)}}
async function updateStock(id){try{await apiFetch('/products/'+id+'/stock',{method:'PATCH',body:JSON.stringify({stock:Number(document.getElementById('q'+id).value)})});load()}catch(e){showError(e)}}
function clearRestockAlerts(){if(confirm('Clear all restock alert subscriptions?')){localStorage.removeItem('supiriRestockAlerts');load();}}
load();
</script><script src="js/admin-auth.js"></script><script>requireAdmin();</script></body></html>
