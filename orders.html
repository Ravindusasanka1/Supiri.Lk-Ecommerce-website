<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supiri.Lk — Orders</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container-fluid"><div class="row">
<aside class="col-md-3 col-lg-2 admin-sidebar p-3"><a href="index.html" class="brand text-white">SUPIRI.LK<small>ADMIN PANEL</small></a><nav class="nav flex-column mt-4 gap-2"><a class="nav-link" href="admin.html">Dashboard</a><a class="nav-link" href="products.html">Products</a><a class="nav-link" href="inventory.html">Inventory</a><a class="nav-link active" href="orders.html">Orders</a><a class="nav-link" href="customers.html">Customers</a><a class="nav-link" href="settings.html">Settings</a><button type="button" class="nav-link btn btn-link text-start mt-3" onclick="adminLogout()">↪ Logout</button></nav></aside>
<main class="col-md-9 col-lg-10 p-4 p-lg-5"><div class="admin-topbar d-flex justify-content-end align-items-center gap-2">
<a href="index.html" class="btn btn-outline-custom">Store</a>
</div><h1 class="fw-bold">Orders</h1><p class="text-secondary">Order data from Node.js backend.</p><div class="table-card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div></div><script src="js/api.js"></script><script>
async function load(){try{const o=await apiFetch('/orders');rows.innerHTML=o.map(x=>`<tr><td>#${x.id}</td><td>${x.customer}</td><td>${x.date}</td><td>Rs. ${Number(x.amount).toLocaleString()}</td><td>${x.status}</td><td><select class="form-select" style="max-width:150px" onchange="status(${x.id},this.value)"><option ${x.status==='Pending'?'selected':''}>Pending</option><option ${x.status==='Paid'?'selected':''}>Paid</option><option ${x.status==='Shipped'?'selected':''}>Shipped</option><option ${x.status==='Delivered'?'selected':''}>Delivered</option></select></td></tr>`).join('')}catch(e){showError(e)}}async function status(id,value){try{await apiFetch('/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:value})})}catch(e){showError(e)}}load();
</script><script src="js/admin-auth.js"></script><script>requireAdmin();</script></body></html>
