<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supiri.Lk — Admin Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container-fluid"><div class="row">
<aside class="col-md-3 col-lg-2 admin-sidebar p-3"><a href="index.html" class="brand text-white">SUPIRI.LK<small>ADMIN PANEL</small></a><nav class="nav flex-column mt-4 gap-2"><a class="nav-link active" href="admin.html">Dashboard</a><a class="nav-link" href="products.html">Products</a><a class="nav-link" href="inventory.html">Inventory</a><a class="nav-link" href="orders.html">Orders</a><a class="nav-link" href="customers.html">Customers</a><a class="nav-link" href="settings.html">Settings</a><button type="button" class="nav-link btn btn-link text-start mt-3" onclick="adminLogout()">↪ Logout</button></nav></aside>
<main class="col-md-9 col-lg-10 p-4 p-lg-5"><div class="admin-topbar d-flex justify-content-end align-items-center gap-2">
<a href="index.html" class="btn btn-outline-custom">Store</a>
</div><div class="d-flex justify-content-between align-items-center"><div><h1 class="fw-bold">Dashboard</h1><p class="text-secondary">Live store dashboard</p></div></div><div class="row g-3 my-3" id="cards"></div><div class="table-card mt-4"><div class="p-3 border-bottom"><h5>Recent Orders</h5></div><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></div></main></div></div><script src="js/api.js"></script><script>
async function load(){try{const d=await apiFetch('/dashboard');cards.innerHTML=`<div class="col-md-3"><a href="products.html" class="text-decoration-none"><div class="stat-card"><div class="display-6 fw-bold">${d.products}</div><div class="text-secondary">Products</div></div></a></div><div class="col-md-3"><a href="orders.html" class="text-decoration-none"><div class="stat-card"><div class="display-6 fw-bold">${d.orders}</div><div class="text-secondary">Orders</div></div></a></div><div class="col-md-3"><a href="inventory.html" class="text-decoration-none"><div class="stat-card"><div class="display-6 fw-bold text-danger">${d.lowStock}</div><div class="text-secondary">Low Stock</div></div></a></div><div class="col-md-3"><a href="customers.html" class="text-decoration-none"><div class="stat-card"><div class="display-6 fw-bold">${d.customers}</div><div class="text-secondary">Customers</div></div></a></div>`;orders.innerHTML=d.recentOrders.map(o=>`<tr><td>#${o.id}</td><td>${o.customer}</td><td>Rs. ${Number(o.amount).toLocaleString()}</td><td>${o.status}</td></tr>`).join('')}catch(e){showError(e)}}load();
</script><script src="js/admin-auth.js"></script><script>requireAdmin();</script></body></html>
