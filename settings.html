<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supiri.Lk — Settings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div class="container-fluid"><div class="row">
<aside class="col-md-3 col-lg-2 admin-sidebar p-3"><a href="index.html" class="brand text-white">SUPIRI.LK<small>ADMIN PANEL</small></a><nav class="nav flex-column mt-4 gap-2"><a class="nav-link" href="admin.html">Dashboard</a><a class="nav-link" href="products.html">Products</a><a class="nav-link" href="inventory.html">Inventory</a><a class="nav-link" href="orders.html">Orders</a><a class="nav-link" href="customers.html">Customers</a><a class="nav-link active" href="settings.html">Settings</a><button type="button" class="nav-link btn btn-link text-start mt-3" onclick="adminLogout()">↪ Logout</button></nav></aside>
<main class="col-md-9 col-lg-10 p-4 p-lg-5"><div class="admin-topbar d-flex justify-content-end align-items-center gap-2">
<a href="index.html" class="btn btn-outline-custom">Store</a>
</div><h1 class="fw-bold">Settings</h1><p class="text-secondary">Saved by the Node.js backend.</p><div class="table-card p-4" style="max-width:720px"><div class="mb-3"><label class="form-label">Store Name</label><input id="storeName" class="form-control"></div><div class="mb-3"><label class="form-label">Admin Email</label><input id="adminEmail" class="form-control"></div><div class="mb-3"><label class="form-label">Delivery Fee</label><input id="deliveryFee" type="number" class="form-control"></div><div class="mb-3"><label class="form-label">Low Stock Threshold</label><input id="threshold" type="number" class="form-control"></div><div class="form-check form-switch mb-3"><input id="emailAlerts" class="form-check-input" type="checkbox"><label class="form-check-label">Email alerts</label></div><div class="form-check form-switch mb-3"><input id="maintenance" class="form-check-input" type="checkbox"><label class="form-check-label">Maintenance mode</label></div><div class="form-check form-switch mb-3"><input id="guestCheckout" class="form-check-input" type="checkbox"><label class="form-check-label">Allow guest checkout</label></div><button class="btn btn-dark-custom" onclick="save()">Save Settings</button> <span id="msg" class="text-success ms-2"></span></div></main></div></div><script src="js/api.js"></script><script>
async function load(){try{const s=await apiFetch('/settings');storeName.value=s.storeName;adminEmail.value=s.adminEmail;deliveryFee.value=s.deliveryFee;threshold.value=s.threshold;emailAlerts.checked=s.emailAlerts;maintenance.checked=s.maintenance;guestCheckout.checked=s.guestCheckout}catch(e){showError(e)}}async function save(){try{await apiFetch('/settings',{method:'PUT',body:JSON.stringify({storeName:storeName.value,adminEmail:adminEmail.value,deliveryFee:Number(deliveryFee.value),threshold:Number(threshold.value),emailAlerts:emailAlerts.checked,maintenance:maintenance.checked,guestCheckout:guestCheckout.checked})});msg.textContent='Saved!';setTimeout(()=>msg.textContent='',1500)}catch(e){showError(e)}}load();
</script><script src="js/admin-auth.js"></script><script>requireAdmin();</script></body></html>
