<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supiri.Lk — Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body{min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.login-wrap{width:100%;max-width:430px}.login-card{background:#fff;padding:42px;border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 70px rgba(0,0,0,.28)}
.login-logo{text-align:center;margin-bottom:30px}.login-logo .brand{font-size:1.7rem}.login-logo small{font-size:.52rem}.login-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;font-weight:700}.login-card .form-control{border-radius:0;border:1px solid var(--line);padding:.85rem}.login-card .form-control:focus{box-shadow:none;border-color:var(--gold)}
.login-footer{text-align:center;color:#aaa;font-size:.72rem;letter-spacing:.08em;margin-top:18px}.demo-box{background:var(--cream);padding:12px;font-size:.78rem;margin-top:18px;border-left:3px solid var(--gold)}
</style>
</head>
<body>
<div class="login-wrap">
<div class="login-card">
<div class="login-logo"><div class="brand">SUPIRI.LK<small>GENTS COLLECTION</small></div><div class="section-label mt-3">ADMIN PORTAL</div></div>
<h2 class="serif text-center mb-2">Welcome back</h2><p class="text-secondary text-center small mb-4">Sign in to manage your store.</p>
<div id="loginError" class="alert alert-danger d-none py-2 small"></div>
<form onsubmit="adminLogin(event)">
<div class="mb-3"><label class="login-label mb-2">Username</label><input id="adminUsername" class="form-control" autocomplete="username" required></div>
<div class="mb-4"><label class="login-label mb-2">Password</label><input id="adminPassword" type="password" class="form-control" autocomplete="current-password" required></div>
<button class="btn btn-dark-custom w-100 py-3" type="submit">Sign In</button>
</form>
<div class="demo-box"><strong>Demo login</strong><br>Username: <b>admin</b><br>Password: <b>admin123</b></div>
</div>
<div class="login-footer">FRONTEND DEMO • SUPIRI.LK</div>
</div>
<script src="js/api.js"></script><script src="js/admin-auth.js"></script>
<script>if(isAdminLoggedIn()) window.location.href='admin.html';</script>
</body></html>
