<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supiri.Lk — Admin | Products</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="container-fluid"><div class="row"><aside class="col-md-3 col-lg-2 admin-sidebar p-3">
<a href="index.html" class="brand text-white">SUPIRI.LK<small>ADMIN PANEL</small></a><nav class="nav flex-column mt-4 gap-2">
<a class="nav-link" href="admin.html">Dashboard</a><a class="nav-link active" href="products.html">Products</a><a class="nav-link" href="inventory.html">Inventory</a><a class="nav-link" href="orders.html">Orders</a><a class="nav-link" href="customers.html">Customers</a><a class="nav-link" href="settings.html">Settings</a><button type="button" class="nav-link btn btn-link text-start mt-3" onclick="adminLogout()">↪ Logout</button></nav></aside>
<main class="col-md-9 col-lg-10 p-4 p-lg-5"><div class="admin-topbar d-flex justify-content-end gap-2"><a href="index.html" class="btn btn-outline-custom">Store</a></div>
<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="fw-bold mb-1">Products</h1><p class="text-secondary">Manage products and product colours.</p></div><button class="btn btn-dark-custom admin-action-btn" data-bs-toggle="modal" data-bs-target="#productModal" onclick="newProduct()">+ Add Product</button></div>
<div class="table-card"><div class="p-3 border-bottom"><input id="search" class="form-control" placeholder="Search by product, SKU or category..."></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Colours</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div></div>
<div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 id="modalTitle" class="modal-title">Add Product</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><input type="hidden" id="editId"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Product Name</label><input id="pName" class="form-control" required></div><div class="col-md-6"><label class="form-label">SKU</label><input id="pSku" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Category</label><select id="pCategory" class="form-select"><option>Shirts</option><option>T-Shirts</option><option>Trousers</option><option>Jeans</option><option>Accessories</option></select></div>
<div class="col-md-6"><label class="form-label">Price (Rs.)</label><input id="pPrice" type="number" min="0" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Stock</label><input id="pStock" type="number" min="0" class="form-control"></div><div class="col-md-6"><label class="form-label">Sizes</label><input id="pSizes" class="form-control" placeholder="S, M, L, XL"></div>
<div class="col-12"><label class="form-label fw-semibold">Product Colours</label><div class="row g-2"><div class="col-md-5"><input id="colorName" class="form-control" placeholder="e.g. Black"></div><div class="col-md-3"><input id="colorHex" type="color" class="form-control form-control-color w-100" value="#000000"></div><div class="col-md-4"><button class="btn btn-outline-secondary w-100" onclick="addColor()">+ Add Colour</button></div></div><div id="colorList" class="mt-2"></div></div>
</div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-dark-custom" onclick="saveProduct()">Save Product</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script>
<script>
let products=[], colors=[];
async function load(){try{products=await apiFetch('/products');render()}catch(e){showError(e)}}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('rows').innerHTML=products.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>{
const cs=(p.colors||[]).map(c=>`<span class="color-chip"><span class="color-dot" style="background:${c.hex}"></span>${c.name}</span>`).join('');
return `<tr><td><b>${p.name}</b><br><small class="text-secondary">${(p.sizes||[]).join(', ')}</small></td><td>${p.sku}</td><td>${p.category}</td><td>Rs. ${Number(p.price).toLocaleString()}</td><td>${cs||'<span class="text-muted">No colours</span>'}</td><td>${p.stock}</td><td><button class="btn btn-sm btn-outline-custom" onclick="edit(${p.id})">Edit</button> <button class="btn btn-sm btn-outline-danger" onclick="del(${p.id})">Delete</button></td></tr>`}).join('')}
function newProduct(){document.getElementById('modalTitle').textContent='Add Product';document.getElementById('editId').value='';['pName','pSku','pPrice','pStock','pSizes'].forEach(id=>document.getElementById(id).value='');document.getElementById('pCategory').value='Shirts';colors=[];renderColors()}
function edit(id){const p=products.find(x=>x.id===id);document.getElementById('modalTitle').textContent='Edit Product';document.getElementById('editId').value=id;document.getElementById('pName').value=p.name;document.getElementById('pSku').value=p.sku;document.getElementById('pCategory').value=p.category;document.getElementById('pPrice').value=p.price;document.getElementById('pStock').value=p.stock;document.getElementById('pSizes').value=(p.sizes||[]).join(', ');colors=JSON.parse(JSON.stringify(p.colors||[]));renderColors();new bootstrap.Modal('#productModal').show()}
function addColor(){const name=document.getElementById('colorName').value.trim(),hex=document.getElementById('colorHex').value;if(!name)return alert('Enter a colour name.');if(colors.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert('This colour already exists.');colors.push({name,hex});document.getElementById('colorName').value='';renderColors()}
function removeColor(i){colors.splice(i,1);renderColors()}
function renderColors(){document.getElementById('colorList').innerHTML=colors.map((c,i)=>`<span class="color-chip"><span class="color-dot" style="background:${c.hex}"></span>${c.name}<button class="btn btn-sm p-0 ms-1" onclick="removeColor(${i})">&times;</button></span>`).join('')}
async function saveProduct(){try{const body={name:pName.value.trim(),sku:pSku.value.trim(),category:pCategory.value,price:Number(pPrice.value||0),stock:Number(pStock.value||0),sizes:pSizes.value.split(',').map(x=>x.trim()).filter(Boolean),colors};if(!body.name||!body.sku)return alert('Product name and SKU are required.');const id=editId.value;if(id)await apiFetch('/products/'+id,{method:'PUT',body:JSON.stringify(body)});else await apiFetch('/products',{method:'POST',body:JSON.stringify(body)});bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();await load()}catch(e){showError(e)}}
async function del(id){if(!confirm('Delete this product?'))return;try{await apiFetch('/products/'+id,{method:'DELETE'});load()}catch(e){showError(e)}}
document.getElementById('search').addEventListener('input',render);load();
</script><script src="js/admin-auth.js"></script><script>requireAdmin();</script></body></html>
